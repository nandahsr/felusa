<header class="header">

    <div class="header-left">

        <div class="logo">
            <img
                src="/images/logo/logo-felusa.png"
                alt="FELUSA"
            />
        </div>

    </div>


    <div class="header-center">

        <!-- Barra de pesquisa -->
        <input
            type="text"
            placeholder="Pesquisar produtos..."
            [(ngModel)]="pesquisa"
            (keyup.enter)="pesquisarProduto()"
        >


        <nav [class.menu-aberto]="menuAberto">

            <a
                routerLink="/"
                (click)="fecharMenu()"
            >
                Inicio
            </a>

            <a
                routerLink="/produtos"
                (click)="fecharMenu()"
            >
                Produtos
            </a>

            <a
                routerLink="/doacao"
                (click)="fecharMenu()"
            >
                Doações
            </a>

            <a
                routerLink="/contato"
                (click)="fecharMenu()"
            >
                Contato
            </a>

        </nav>

    </div>


    <div class="header-right">

        <button
            type="button"
            class="botao-carrinho"
            (click)="abrirCarrinho()"
        >

            🛒

            @if (quantidadeCarrinho > 0) {

                <span class="numero-carrinho">
                    {{ quantidadeCarrinho }}
                </span>

            }

        </button>


        <button
            type="button"
            class="menu-button"
            (click)="abrirMenu()"
        >
            ☰
        </button>

    </div>

</header>
